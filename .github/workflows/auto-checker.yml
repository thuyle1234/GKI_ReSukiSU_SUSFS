name: Kernel Update Checker & Config Auto-Updater

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force config update and notification for testing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Google for New Sublevel
        id: check_sublevel
        run: |
          GOOGLE_SUBLEVEL=$(git ls-remote --tags https://android.googlesource.com/kernel/common 'refs/tags/android13-5.15.*' \
            | awk -F'/' '{print $3}' \
            | grep -E '^android13-5\.15\.[0-9]+' \
            | sed -E 's/android13-5\.15\.([0-9]+).*/\1/' \
            | sort -n \
            | tail -n 1)

          echo "Latest sublevel on Google upstream: $GOOGLE_SUBLEVEL"

          if [ -z "$GOOGLE_SUBLEVEL" ]; then
            echo "Error: Failed to fetch upstream SUBLEVEL tags from Google."
            exit 1
          fi

          LOCAL_SUBLEVEL=$(jq '[.include[] | select(.sublevel != "X" and .sublevel != "lts") | .sublevel | tonumber] | max' .github/config/android13-5.15.json)
          echo "Highest sublevel in repository config: $LOCAL_SUBLEVEL"

          IF_FORCE="${{ github.event.inputs.force_update }}"
          if [ "$GOOGLE_SUBLEVEL" -gt "$LOCAL_SUBLEVEL" ] || [ "$IF_FORCE" = "true" ]; then
            echo "NEW_UPDATE_FOUND=true" >> $GITHUB_ENV
            echo "GOOGLE_SUBLEVEL=$GOOGLE_SUBLEVEL" >> $GITHUB_ENV
          else
            echo "NEW_UPDATE_FOUND=false" >> $GITHUB_ENV
            echo "GOOGLE_SUBLEVEL=$GOOGLE_SUBLEVEL" >> $GITHUB_ENV
          fi

      # --- BRANCH 1: NO UPDATE AVAILABLE ---
      - name: Notify Discord - No Update
        if: env.NEW_UPDATE_FOUND == 'false'
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{
            "embeds": [{
              "title": "🔍 Kernel Update Check",
              "description": "No new subpatch detected on Google upstream. Currently up to date.",
              "color": 3447003,
              "fields": [
                {"name": "Current Config Sublevel", "value": "5.15.'${{ env.GOOGLE_SUBLEVEL }}'", "inline": true}
              ],
              "footer": {"text": "WildKernels Automated Checker"}
            }]
          }' "${{ secrets.DISCORD_WEBHOOK }}"

      # --- BRANCH 2: NEW UPDATE FOUND ---
      - name: Update Config File
        if: env.NEW_UPDATE_FOUND == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_YM=$(date -u +'%Y-%m')
          
          jq --arg sub "$GOOGLE_SUBLEVEL" --arg dt "$CURRENT_YM" \
            '.include = [.include[] | select(.date != "lts")] + [{"sublevel": $sub, "date": $dt}] + [.include[] | select(.date == "lts")]' \
            .github/config/android13-5.15.json > tmp.json && mv tmp.json .github/config/android13-5.15.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/config/android13-5.15.json
          git commit -m "Auto-update config: add Android 13 5.15.$GOOGLE_SUBLEVEL ($CURRENT_YM)" || echo "No changes to commit"
          
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}

      - name: Notify Discord - New Update Ready
        if: env.NEW_UPDATE_FOUND == 'true' && success()
        run: |
          CURRENT_YM=$(date -u +'%Y-%m')
          curl -H "Content-Type: application/json" -X POST -d '{
            "embeds": [{
              "title": "🚀 New Kernel Subpatch Detected!",
              "description": "Google released a new subpatch. Configuration has been updated in the repository and is **ready for manual build**.",
              "color": 15844367,
              "fields": [
                {"name": "New Sublevel", "value": "5.15.'${{ env.GOOGLE_SUBLEVEL }}'", "inline": true},
                {"name": "Patch Date", "value": "'"$CURRENT_YM"'", "inline": true},
                {"name": "Actions Dashboard", "value": "[Trigger Build Here]('${{ github.server_url }}/${{ github.repository }}/actions/workflows/main.yml')", "inline": false}
              ],
              "footer": {"text": "WildKernels Config Updater"}
            }]
          }' "${{ secrets.DISCORD_WEBHOOK }}"

      - name: Notify Discord - Config Update Failure
        if: env.NEW_UPDATE_FOUND == 'true' && failure()
        run: |
          curl -H "Content-Type: application/json" -X POST -d '{
            "embeds": [{
              "title": "❌ Failed to Update Configuration!",
              "description": "An error occurred while attempting to update the repository configuration file.",
              "color": 15158332,
              "fields": [
                {"name": "Workflow Run", "value": "[Check Logs]('${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')", "inline": true}
              ]
            }]
          }' "${{ secrets.DISCORD_WEBHOOK }}"
